<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="../"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.9939 4.14327C17.7129 1.92452 13.7606 1.80816 10.1662 3.88337C8.5671 4.80659 7.05945 6.23311 6.08909 8.02161C5.11872 9.81011 4.60083 12.0113 4.60083 14.212C4.60083 16.4128 4.69418 18.0653 6.08528 20.0339C7.31459 21.7735 11.2134 22.3481 14.8078 20.2729C18.4021 18.1977 20.2775 14.7167 18.9965 12.498C18.483 11.6085 17.5401 11.0569 16.3631 10.849C18.9098 8.78272 20.0741 6.01424 18.9939 4.14327Z" fill="currentColor"/></svg>버짓리스트</a>
    <nav aria-label="주요 메뉴">
      <a href="../guide/">사용설명서</a>
      <a href="../wedding/">결혼 준비</a>
      <a href="../baby/">출산 준비</a>
      <a href="../guestbook/">축의금</a>
    </nav>
    <span class="spacer"></span>
    <div id="authSlot" class="auth-slot"></div>
    
  </div>
</header>

<div class="wrap" id="planner">
  <nav class="file-bar" aria-label="파일">
    <a class="back-desk" href="../"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9.5 3.5L5 8l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>버짓보드</a>
    <span class="file-bar-sep" aria-hidden="true">/</span>
    <details class="menu file-switch">
      <summary class="file-switch-btn" aria-label="다른 파일 열기" title="다른 파일 열기">
        <span class="file-dot" aria-hidden="true"></span>
        <span id="fileName">예산표</span>
        <svg class="chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </summary>
      <div class="menu-pop" id="fileList"></div>
    </details>
    <div class="color-pick">
      <details class="menu color-menu">
        <summary class="color-btn" id="colorBtn" aria-label="테마 색상: 초록" title="테마 색상: 초록"><span>색상</span><span class="color-dot" aria-hidden="true"></span></summary>
        <div class="menu-pop" role="group" aria-label="테마 색상"><button type="button" class="swatch" data-accent="orange" aria-pressed="false" aria-label="주황" title="주황"></button><button type="button" class="swatch" data-accent="navy" aria-pressed="false" aria-label="파랑" title="파랑"></button><button type="button" class="swatch" data-accent="green" aria-pressed="false" aria-label="초록" title="초록"></button><button type="button" class="swatch" data-accent="pink" aria-pressed="false" aria-label="분홍" title="분홍"></button><button type="button" class="swatch" data-accent="purple" aria-pressed="false" aria-label="자주" title="자주"></button><button type="button" class="swatch" data-accent="teal" aria-pressed="false" aria-label="청록" title="청록"></button></div>
      </details>
    </div>
  </nav>

  <!-- 요약 카드: 이름 · 남은 날 · 진행 · 예산/지출 합계 · 내보내기를 한 장에 -->
  <section class="plan-card" id="planCard" aria-label="요약">
    <div class="pc-top title-row">
      <div class="pc-title">
        <input id="planTitle" class="plan-title" type="text" aria-label="예산표 이름" value="">
        <svg class="pc-pen" viewBox="0 0 16 16" aria-hidden="true"><path d="M10.5 3l2.5 2.5L6 12.5H3.5V10z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
      </div>
      <span class="title-done" id="titleDone" aria-live="polite"></span>
      <button type="button" id="ddayChip" class="dday-chip">날짜 정하기</button>
    </div>
    <!-- 카테고리 가로 목록. 스크롤해서 카드가 지나가면 위에 붙는 막대로 옮겨 가요 -->
    <div class="pc-cats-slot" id="cardCats">
      <div class="pb-cats" id="pbCats">
        <div class="cat-strip" id="catNavList" role="list" aria-label="카테고리"></div>
        <button type="button" class="cat-strip-add" id="addCat" aria-label="카테고리 추가" title="카테고리 추가"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
        <button type="button" class="cat-strip-top" id="toTop" aria-label="맨 위로" title="맨 위로"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 2.5h9M8 13.5V5.5M4.8 8.7L8 5.5l3.2 3.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </div>
    <div class="pc-nums">
      <div class="t-main">
        <div class="t-label" id="tBudgetLabel">예산 합계</div>
        <div class="t-num" id="tBudget">0원</div>
        <div class="t-man" id="tBudgetMan">&nbsp;</div>
      </div>
      <!-- 템플릿에 예산 구성(미니멀·스탠다드·풀옵션 …)이 있으면, 눌러서 선택지를 그 구성으로 한 번에 바꿔요 -->
      <div class="t-tiers" id="tTiers" hidden>
        <div class="t-label">예산 구성</div>
        <div class="seg tier-seg" id="tierSeg" role="group" aria-label="예산 구성"></div>
      </div>
      <div class="t-main t-spend">
        <div class="t-label">지출 합계</div>
        <div class="t-num" id="tSpend">0원</div>
        <div class="t-man" id="tSpendMan">&nbsp;</div>
      </div>
      <div class="t-small t-people">
        <div class="t-label">인원</div>
        <div class="t-num" id="tPeople">0명</div>
      </div>
      <div class="t-export">
        <div class="saved-at" id="savedAt" aria-live="polite"></div>
        <button type="button" id="exportBtn" class="export">엑셀로 내보내기</button>
      </div>
    </div>
    <!-- 템플릿의 설명글은 캐릭터가 말풍선으로 건네요. × 로 닫으면 그 파일에서는 다시 안 나와요. -->
    <div class="hello" id="hello" hidden>
      <div class="hello-bubble" role="note">
        <p id="helloText"></p>
        <button type="button" class="hello-x" id="helloClose" aria-label="말풍선 닫기" title="닫기"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
      </div>
      <img class="hello-char" src="../assets/hello-char.png" alt="" width="52" height="52">
    </div>
  </section>

  <div class="toolbar">
    <div class="tool-group">
    <details class="menu tpl-menu">
      <summary class="tpl-btn"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="1.5" width="11" height="13" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M5 5.5h6M5 8h6M5 10.5h3.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>템플릿 불러오기<svg class="chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></summary>
      <div class="menu-pop">
        <div class="menu-note">지금 예산표의 내용이 고른 것으로 바뀌어요</div>
        <button type="button" id="tplBlank" data-tpl="blank" data-label="빈 목록">빈 목록<small>카테고리 1개와 빈 항목으로 새로 시작</small></button>
        <!-- the other templates are added from #templateData -->
        <hr>
        <button type="button" id="importBtn">엑셀 불러오기<small>여기서 내보낸 엑셀 파일의 내용으로 채워요</small></button>
      </div>
    </details>
    <input id="importFile" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
    <button id="shareBtn" class="tool-btn" type="button" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="12" cy="3.5" r="2" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="4" cy="8" r="2" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="12" cy="12.5" r="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5.8 7l4.4-2.5M5.8 9l4.4 2.5" stroke="currentColor" stroke-width="1.4"/></svg>같이 쓰기</button>
    </div>
    <div class="view-opts">
    <label class="opt-toggle"><input type="checkbox" id="allOptsToggle"><span class="switch" aria-hidden="true"></span><span>선택지 모두 보기</span></label>
    <label class="opt-toggle"><input type="checkbox" id="spendToggle"><span class="switch" aria-hidden="true"></span><span>지출 칸 보기</span></label>
    <div class="view-toggle">
      <div class="seg" role="group" aria-label="카테고리를 몇 열로 볼지">
        <button type="button" data-cols="1" aria-pressed="true"><svg viewBox="0 0 16 12" aria-hidden="true"><rect x="0.5" y="0.5" width="15" height="11" rx="1.5" fill="none" stroke="currentColor"/></svg>1열</button>
        <button type="button" data-cols="2" aria-pressed="false"><svg viewBox="0 0 16 12" aria-hidden="true"><rect x="0.5" y="0.5" width="6.5" height="11" rx="1.5" fill="none" stroke="currentColor"/><rect x="9" y="0.5" width="6.5" height="11" rx="1.5" fill="none" stroke="currentColor"/></svg>2열</button>
        <button type="button" data-cols="4" aria-pressed="false"><svg viewBox="0 0 16 12" aria-hidden="true"><rect x="0.5" y="0.5" width="2.6" height="11" rx="1" fill="none" stroke="currentColor"/><rect x="4.6" y="0.5" width="2.6" height="11" rx="1" fill="none" stroke="currentColor"/><rect x="8.7" y="0.5" width="2.6" height="11" rx="1" fill="none" stroke="currentColor"/><rect x="12.9" y="0.5" width="2.6" height="11" rx="1" fill="none" stroke="currentColor"/></svg>4열</button>
      </div>
    </div>
    </div>
  </div>

  <!-- 위에 붙는 막대: 스크롤해서 요약 카드의 카테고리 목록이 지나가면 화면 위에 나타나요.
       한 줄 요약과 함께, 카드에 있던 카테고리 목록(+ 포함)을 그대로 옮겨 와 보여 줍니다. -->
  <div class="plan-bar" id="planBar">
    <div class="pb-mini" aria-hidden="true">
      <b class="pb-title" id="barTitle"></b>
      <span class="pb-chip" id="barDday"></span>
      <span class="pb-stat" id="barDone"></span>
      <span class="pb-stat" id="barBudget"></span>
      <span class="pb-stat pb-spend" id="barSpend"></span>
    </div>
  </div>

  <main id="cats" aria-live="polite"></main>
  <button id="addCatBottom" class="add-cat" type="button">카테고리 추가</button>

  <p class="save-note">적는 대로 자동으로 저장돼요. 파일을 지우거나 이름을 바꾸는 건 <a href="../">버짓보드</a>에서 합니다.</p>
  <div class="foot-actions"><button id="clearAllItems" type="button">카테고리만 남기고 항목 비우기</button><button id="resetAll" type="button">내용 비우기</button></div>
</div>

<dialog id="optDialog" class="opt-dialog" aria-labelledby="optTitle">
  <div class="opt-inner">
    <div class="opt-head">
      <div>
        <h2 id="optTitle">선택지</h2>
        <p id="optSub"></p>
      </div>
      <button type="button" class="opt-x" data-close aria-label="닫기">×</button>
    </div>
    <div id="optList" class="opt-list"></div>
    <p class="aff-note" id="affNote" hidden>이 항목의 일부 링크는 쿠팡 파트너스 활동의 일환으로, 이에 따라 일정액의 수수료를 제공받습니다.</p>
    <form id="optForm" class="opt-form" autocomplete="off">
      <div class="opt-form-title" id="optFormTitle">선택지 추가</div>
      <input name="name" type="text" placeholder="이름 (제품, 업체 등)" aria-label="선택지 이름">
      <div class="opt-form-row">
        <input name="link" type="text" inputmode="url" placeholder="참고 링크 (선택)" aria-label="참고 링크">
        <input name="price" type="text" inputmode="numeric" class="money" placeholder="가격" aria-label="가격">
      </div>
      <input name="note" type="text" placeholder="비고 (선택) · 예: 대여 포함, 3월 할인" aria-label="비고">
      <div class="opt-form-foot">
        <small>고르면 이 항목의 금액이 가격 × 수량으로 바뀌어요</small>
        <button type="submit" class="btn-ghost" id="optSubmit">추가</button>
        <button type="button" class="btn-primary" id="optDone">확인</button>
      </div>
    </form>
  </div>
</dialog>

<!-- 카테고리 이름 앞 이모지 고르기. 카테고리마다 같은 상자를 그 자리에 띄워요. -->
<div class="menu-pop emoji-pop" id="catEmojiPop" role="dialog" aria-label="카테고리 이모지 고르기" hidden>
  <div class="emoji-grid" id="emojiGrid"></div>
  <button type="button" class="emoji-clear" id="emojiClear">이모지 없애기</button>
</div>

<div id="toast" class="toast" role="status"></div>

<script src="../assets/config.js?v=20260923v"></script>
<script src="../assets/auth.js?v=20260926i"></script>
<script src="../assets/store.js?v=20261008a"></script>
<script src="../assets/shell.js?v=20260926g"></script>
<script src="../assets/app.js?v=20261008a"></script>
</body>

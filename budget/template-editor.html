<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>템플릿 편집기</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
:root{
  --paper:#F2F4F6; --sheet:#FFFFFF; --ink:#1B2230; --muted:#667085; --line:#DDE2E8;
  --accent:#1A766B; --accent-fill:#26A392; --accent-soft:#DDF3EF; --on-accent:#FFFFFF; --warn:#B4233C;
  --sans:"Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#12161D; --sheet:#1A2029; --ink:#E7EAEE; --muted:#9AA3B2; --line:#2C3440;
    --accent:#6FB7B1; --accent-fill:#6FB7B1; --accent-soft:#1F3534; --on-accent:#12161D; --warn:#F07A8E;
  }
}
:root[data-theme="dark"]{
  --paper:#12161D; --sheet:#1A2029; --ink:#E7EAEE; --muted:#9AA3B2; --line:#2C3440;
  --accent:#6FB7B1; --accent-fill:#6FB7B1; --accent-soft:#1F3534; --on-accent:#12161D; --warn:#F07A8E;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.top{
  position:sticky;top:0;z-index:10;background:color-mix(in srgb, var(--paper) 92%, transparent);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.top-inner{max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px}
.top h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-0.02em}
.top p{margin:2px 0 0;color:var(--muted);font-size:13px}
.top .spacer{flex:1}
.saved{color:var(--muted);font-size:12.5px;white-space:nowrap}
.btn{
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:8px 13px;font-size:13.5px;font-weight:500;
}
.btn:hover{background:color-mix(in srgb, var(--ink) 5%, var(--sheet))}
.btn:active{background:color-mix(in srgb, var(--ink) 11%, var(--sheet))}
.btn.primary{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--on-accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn svg{width:14px;height:14px}

.layout{max-width:1180px;margin:0 auto;padding:20px;display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;align-items:start}
.side{position:sticky;top:86px}
.side h2,.section-title{font-size:12.5px;color:var(--muted);font-weight:600;margin:0 0 8px;letter-spacing:.02em}
.tpl-list{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:6px}
.tpl-item{
  width:100%;display:flex;align-items:center;gap:8px;text-align:left;border:1px solid var(--line);background:var(--sheet);
  border-radius:10px;padding:10px 12px;
}
.tpl-item:hover{background:color-mix(in srgb, var(--ink) 4%, var(--sheet))}
.tpl-item.on{border-color:var(--accent-fill);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent-fill)}
.tpl-item .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tpl-item .ct{color:var(--muted);font-size:12px;white-space:nowrap}
.badge{font-size:11px;padding:1px 6px;border-radius:999px;background:var(--paper);color:var(--muted)}
.side .btn{width:100%;justify-content:center}
.hint{color:var(--muted);font-size:12.5px;margin:14px 2px 0;line-height:1.6}
.hint b{color:var(--ink);font-weight:600}

.card{background:var(--sheet);border-radius:12px;border:1px solid var(--line)}
.meta{padding:18px 20px;margin-bottom:18px}
.meta-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.meta-head h2{margin:0;font-size:17px;font-weight:700;flex:1}
.fields{display:grid;grid-template-columns:repeat(2, minmax(0,1fr));gap:10px 14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.wide{grid-column:1 / -1}
.field span{font-size:12.5px;color:var(--muted);font-weight:500}
.field .row-in{display:flex;gap:6px}
input.in,select.in,textarea.in{
  width:100%;min-width:0;border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:8px 11px;
}
input.in:focus,select.in:focus,textarea.in:focus{outline:none;border-color:var(--accent)}
.intro-in{font:inherit;line-height:1.5;resize:vertical;min-height:72px}

.cat{position:relative;margin-bottom:14px;border-left:4px solid var(--accent-fill);border-radius:0 12px 12px 0} /* items are measured against their card */
.cat-top{display:flex;align-items:center;gap:6px;padding:12px 14px 8px 16px}
.cat-top .cat-name{flex:1;font-weight:700;font-size:16px;border:1px solid transparent;border-radius:8px;padding:6px 8px;background:transparent;min-width:0}
.cat-top .cat-name:hover{border-color:var(--line)}
.cat-top .cat-name:focus{outline:none;border-color:var(--accent);background:var(--paper)}
.cat-top .count{color:var(--muted);font-size:12.5px;white-space:nowrap;margin-right:4px}
.ic{
  width:30px;height:30px;border:0;border-radius:6px;background:none;color:var(--muted);display:grid;place-items:center;flex:none;
}
.ic:hover{background:color-mix(in srgb, var(--ink) 6%, transparent);color:var(--ink)}
.ic:active{background:color-mix(in srgb, var(--ink) 11%, transparent)}
.ic:disabled{opacity:.3;cursor:default;background:none}
.ic.danger:hover{color:var(--warn)}
.ic svg{width:15px;height:15px}
.cat.folded .items,.cat.folded .add-row{display:none}
.cat.folded .fold svg{transform:rotate(180deg)}

.items{padding:0 14px 4px 16px}
.ihead,.item{display:grid;grid-template-columns:18px minmax(0,1fr) 70px 110px 120px 96px;gap:8px;align-items:center}
.guest .ihead,.guest .item{grid-template-columns:18px minmax(0,1fr) 120px 96px}
/* drag handle for items */
.item-grip{
  width:18px;height:28px;padding:0;border:0;border-radius:5px;background:none;color:var(--muted);
  display:grid;place-items:center;cursor:grab;opacity:.6;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
}
.item-grip svg{width:8px;height:14px}
.item:hover .item-grip,.item-grip:focus-visible{opacity:1}
.item-grip:hover{background:color-mix(in srgb, var(--ink) 6%, transparent);color:var(--ink)}
@media (hover:none){.item-grip{opacity:1}}
.item.dragging{
  z-index:30;background:var(--sheet);border-radius:8px;border-bottom:0;padding:5px 8px 5px 0;
  box-shadow:0 12px 28px rgba(15,20,30,.2);outline:2px solid var(--accent-fill);outline-offset:-1px;pointer-events:none;
}
.item-slot{border:2px dashed color-mix(in srgb, var(--accent-fill) 70%, transparent);border-radius:8px;background:color-mix(in srgb, var(--accent-soft) 60%, transparent);margin:2px 0}
body.is-sorting,body.is-sorting *{cursor:grabbing !important;user-select:none;-webkit-user-select:none}
.guest .col-qty,.guest .col-opt{display:none}
.ihead{font-size:12px;color:var(--muted);padding:4px 0;border-bottom:1px solid var(--line)}
.ihead .r{text-align:right;padding-right:10px}
.item{padding:5px 0;border-bottom:1px solid var(--line)}
.item input{width:100%;min-width:0;border:1px solid transparent;border-radius:6px;padding:6px 9px;background:transparent}
.item input:hover{border-color:var(--line)}
.item input:focus{outline:none;border-color:var(--accent);background:var(--paper)}
.item input.num{text-align:right;font-variant-numeric:tabular-nums}
.item .acts{display:flex;justify-content:flex-end}
.opt-btn{
  width:100%;height:30px;border:1px dashed var(--line);border-radius:6px;background:none;color:var(--muted);font-size:12.5px;
}
.opt-btn.has{border-style:solid;border-color:color-mix(in srgb, var(--accent-fill) 45%, var(--line));background:var(--accent-soft);color:var(--ink)}
.opt-btn.open{box-shadow:inset 0 0 0 1px var(--accent-fill)}
.opts{grid-column:1 / -1;margin:4px 0 6px;padding:10px 12px;border-radius:8px;background:var(--paper)}
.opts-title{font-size:12px;color:var(--muted);margin-bottom:6px}
.opt{display:grid;grid-template-columns:minmax(0,1fr) 110px minmax(0,1.1fr) minmax(0,1fr) 30px;gap:6px;align-items:center;margin-bottom:4px}
.opt .num{text-align:right;font-variant-numeric:tabular-nums}
.opt-head{display:grid;grid-template-columns:minmax(0,1fr) 110px minmax(0,1.1fr) minmax(0,1fr) 30px;gap:6px;font-size:11.5px;color:var(--muted);margin:0 0 3px;padding:0 2px}
.opt-head .r{text-align:right;padding-right:10px}
.opt input{background:var(--sheet);border-color:var(--line)}
.add-link{border:0;background:none;color:var(--accent);font-weight:500;padding:6px 2px;font-size:13.5px}
.add-link:hover{text-decoration:underline}
.add-row{padding:4px 16px 12px}
.add-cat{
  width:100%;padding:14px;border:1.5px dashed var(--line);border-radius:12px;background:transparent;color:var(--muted);font-weight:500;
}
.add-cat:hover{border-color:var(--accent);color:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:40px 20px;border:1.5px dashed var(--line);border-radius:12px}

.toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(10px);
  background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:14px;display:flex;gap:14px;align-items:center;
  opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:20;max-width:90vw;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.show.has-action{pointer-events:auto}
.toast button{border:0;background:none;color:var(--accent-soft);font-weight:600;text-decoration:underline;padding:0}

@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  .side{position:static}
  .fields{grid-template-columns:1fr}
  .ihead{display:none}
  .item{grid-template-columns:18px minmax(0,1fr) 64px 96px;grid-template-areas:"g n q b" ". o o a"}
  .guest .item{grid-template-columns:18px minmax(0,1fr) 110px 96px;grid-template-areas:"g n b a"}
  .opt{grid-template-columns:minmax(0,1fr) 96px 30px;grid-template-areas:"on op od" "ol ol ol" "nt nt nt"}
  .opt-head{display:none}
  .opt [data-f=opt-name]{grid-area:on}.opt [data-f=opt-price]{grid-area:op}.opt [data-f=opt-link]{grid-area:ol}.opt [data-f=opt-note]{grid-area:nt}.opt .ic{grid-area:od}
  .item .item-grip{grid-area:g}.item .col-name{grid-area:n}.item .col-qty{grid-area:q}.item .col-budget{grid-area:b}.item .col-opt{grid-area:o}.item .acts{grid-area:a}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div>
      <h1>기본 템플릿 편집기</h1>
      <p>여기서 고친 뒤 <b>JSON 내려받기</b>를 누르면, 그 파일로 예산표 사이트의 템플릿을 바꿀 수 있어요.</p>
    </div>
    <span class="spacer"></span>
    <span class="saved" id="saved">이 브라우저에 자동 저장돼요</span>
    <button class="btn" id="importBtn" type="button" title=".json 파일이나 budget-checklist.html에서 템플릿을 불러와요">불러오기</button>
    <input type="file" id="importFile" accept=".json,.html,application/json,text/html" hidden>
    <button class="btn" id="resetBtn" type="button">처음 상태로</button>
    <button class="btn" id="copyBtn" type="button">JSON 복사</button>
    <button class="btn primary" id="downloadBtn" type="button"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v8M4.8 6.8L8 10l3.2-3.2M2.5 10.5v2a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>JSON 내려받기</button>
  </div>
</header>

<div class="layout">
  <aside class="side">
    <h2>템플릿 (메뉴 순서)</h2>
    <ol class="tpl-list" id="tplList"></ol>
    <button class="btn" id="addTpl" type="button">+ 새 템플릿</button>
    <p class="hint">
      <b>Enter</b> — 항목 이름에서 누르면 아래에 새 항목이 생겨요.<br>
      <b>여러 줄 붙여넣기</b> — 항목 이름 칸에 줄바꿈된 목록을 붙여넣으면 줄마다 항목이 생겨요.<br>
      <b>선택지</b> — 브랜드·업체 추천. 가격 없이 이름과 비고만 넣어요.<br>
      '빈 목록'은 사이트에 항상 맨 위에 있어서 여기엔 없어요.
    </p>
  </aside>
  <main id="editor"></main>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  const KEY = "template-editor-v1";
  const ORIGINAL = JSON.parse(document.getElementById("original").textContent);
  const clone = v => JSON.parse(JSON.stringify(v));

  let data = null, sel = 0;
  try{ const raw = localStorage.getItem(KEY); if(raw){ const s = JSON.parse(raw); if(Array.isArray(s.templates)){ data = s.templates; sel = s.sel || 0; } } }catch(e){}
  if(!data) data = clone(ORIGINAL);

  const openOpts = new WeakSet(); // items whose 선택지 are expanded
  const folded = new WeakSet();   // collapsed categories

  // ---- helpers ----
  const esc = v => String(v == null ? "" : v).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const plain = n => n ? Number(n).toLocaleString("ko-KR") : "";
  const digits = s => { const d = String(s).replace(/[^\d]/g, ""); return d ? parseInt(d, 10) : 0; };
  const tpl = () => data[sel];
  const move = (arr, i, j) => { if(j < 0 || j >= arr.length) return false; const [x] = arr.splice(i, 1); arr.splice(j, 0, x); return true; };
  const ICON = {
    up: '<svg viewBox="0 0 16 16"><path d="M4 10l4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    down: '<svg viewBox="0 0 16 16"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    del: '<svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
    fold: '<svg viewBox="0 0 16 16"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    copy: '<svg viewBox="0 0 16 16"><rect x="5" y="5" width="8.5" height="8.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M11 3.5V3a1 1 0 0 0-1-1H3.5a1 1 0 0 0-1 1v6.5a1 1 0 0 0 1 1H4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>'
  };
  const newId = () => "tpl-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  const itemCount = t => t.categories.reduce((s, c) => s + c.items.length, 0);
  function autoDesc(t){
    const names = t.categories.map(c => c.name).filter(Boolean);
    if(!names.length) return "";
    return `${names.slice(0, 4).join("·")}${names.length > 4 ? " 등" : ""} ${names.length}개 카테고리`;
  }

  // ---- save / undo ----
  let saveTimer;
  function save(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try{ localStorage.setItem(KEY, JSON.stringify({ templates: data, sel })); document.getElementById("saved").textContent = "자동 저장됨 · " + new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" }); }catch(e){}
    }, 300);
  }
  const snapshot = () => JSON.stringify({ data, sel });
  let toastTimer;
  function toast(msg, snap){
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.toggle("has-action", !!snap);
    if(snap){
      const b = document.createElement("button");
      b.type = "button"; b.textContent = "되돌리기";
      b.onclick = () => { const s = JSON.parse(snap); data = s.data; sel = s.sel; renderAll(); save(); el.classList.remove("show", "has-action"); };
      el.appendChild(b);
    }
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show", "has-action"), snap ? 6000 : 2400);
  }

  // ---- render ----
  const listEl = document.getElementById("tplList");
  const edEl = document.getElementById("editor");

  function renderList(){
    listEl.innerHTML = data.map((t, i) => `<li>
      <button type="button" class="tpl-item${i === sel ? " on" : ""}" data-sel="${i}">
        <span class="nm">${esc(t.label || "이름 없음")}</span>
        ${t.kind === "guestbook" ? '<span class="badge">방명록</span>' : ""}
        <span class="ct">${t.categories.length}·${itemCount(t)}</span>
      </button></li>`).join("");
  }

  function itemHTML(t, ci, ii, it){
    const opts = it.options || [];
    const open = openOpts.has(it);
    return `<div class="item" data-ci="${ci}" data-ii="${ii}">
      <button type="button" class="item-grip" aria-label="순서 바꾸기 (드래그하거나 방향키)" title="드래그해서 옮기기 — 다른 카테고리로도 옮길 수 있어요"><svg viewBox="0 0 8 14" aria-hidden="true"><circle cx="2" cy="2" r="1.3" fill="currentColor"/><circle cx="6" cy="2" r="1.3" fill="currentColor"/><circle cx="2" cy="7" r="1.3" fill="currentColor"/><circle cx="6" cy="7" r="1.3" fill="currentColor"/><circle cx="2" cy="12" r="1.3" fill="currentColor"/><circle cx="6" cy="12" r="1.3" fill="currentColor"/></svg></button>
      <input class="col-name" data-f="name" value="${esc(it.name)}" placeholder="${t.kind === "guestbook" ? "이름 (비워 두면 빈 줄)" : "항목 이름"}" aria-label="항목 이름">
      <input class="col-qty num" data-f="qty" inputmode="numeric" value="${it.qty > 1 ? it.qty : ""}" placeholder="1" aria-label="수량">
      <input class="col-budget num" data-f="budget" inputmode="numeric" value="${plain(it.budget)}" placeholder="${t.kind === "guestbook" ? "축의금" : "예산"}" aria-label="기본 금액">
      <button type="button" class="col-opt opt-btn${opts.length ? " has" : ""}${open ? " open" : ""}" data-act="opts">${opts.length ? `선택지 ${opts.length}개` : "+ 선택지"}</button>
      <span class="acts">
        <button type="button" class="ic" data-act="item-up" title="위로" aria-label="위로" ${ii === 0 ? "disabled" : ""}>${ICON.up}</button>
        <button type="button" class="ic" data-act="item-down" title="아래로" aria-label="아래로" ${ii === t.categories[ci].items.length - 1 ? "disabled" : ""}>${ICON.down}</button>
        <button type="button" class="ic danger" data-act="item-del" title="삭제" aria-label="항목 삭제">${ICON.del}</button>
      </span>
      ${open && t.kind !== "guestbook" ? `<div class="opts">
        <div class="opts-title">선택지 — 추천 브랜드·업체. 가격·링크·비고는 비워 둬도 돼요</div>
        ${opts.length ? `<div class="opt-head"><span>이름</span><span class="r">가격</span><span>링크</span><span>비고</span><span></span></div>` : ""}
        ${opts.map((o, oi) => `<div class="opt" data-oi="${oi}">
          <input class="in" data-f="opt-name" value="${esc(o.name)}" placeholder="이름 (예: 스토케)" aria-label="선택지 이름">
          <input class="in num" data-f="opt-price" inputmode="numeric" value="${plain(o.price)}" placeholder="가격" aria-label="선택지 가격">
          <input class="in" data-f="opt-link" inputmode="url" value="${esc(o.link)}" placeholder="링크 (예: coupang.com/...)" aria-label="선택지 링크">
          <input class="in" data-f="opt-note" value="${esc(o.note)}" placeholder="비고" aria-label="선택지 비고">
          <button type="button" class="ic danger" data-act="opt-del" title="삭제" aria-label="선택지 삭제">${ICON.del}</button>
        </div>`).join("")}
        <button type="button" class="add-link" data-act="opt-add">+ 선택지 추가</button>
      </div>` : ""}
    </div>`;
  }

  function renderEditor(){
    const t = tpl();
    if(!t){ edEl.innerHTML = `<div class="empty">템플릿이 없어요. 왼쪽에서 새 템플릿을 추가하세요.</div>`; return; }
    const guest = t.kind === "guestbook";
    edEl.innerHTML = `
      <section class="card meta">
        <div class="meta-head">
          <h2>${esc(t.label || "이름 없음")}</h2>
          <button type="button" class="ic" data-act="tpl-up" title="메뉴에서 위로" aria-label="메뉴에서 위로" ${sel === 0 ? "disabled" : ""}>${ICON.up}</button>
          <button type="button" class="ic" data-act="tpl-down" title="메뉴에서 아래로" aria-label="메뉴에서 아래로" ${sel === data.length - 1 ? "disabled" : ""}>${ICON.down}</button>
          <button type="button" class="ic" data-act="tpl-dup" title="복제" aria-label="템플릿 복제">${ICON.copy}</button>
          <button type="button" class="ic danger" data-act="tpl-del" title="템플릿 삭제" aria-label="템플릿 삭제">${ICON.del}</button>
        </div>
        <div class="fields">
          <label class="field"><span>메뉴 이름</span><input class="in" data-f="label" value="${esc(t.label)}" placeholder="예: 결혼 준비"></label>
          <label class="field"><span>불러오면 들어가는 예산표 제목</span><input class="in" data-f="title" value="${esc(t.title)}" placeholder="예: 우리 결혼 준비"></label>
          <div class="field wide"><span>메뉴 설명</span>
            <div class="row-in"><input class="in" data-f="desc" value="${esc(t.desc)}" placeholder="예: 결혼식장·스드메 등 10개 카테고리">
            <button type="button" class="btn" data-act="auto-desc" title="카테고리 이름으로 설명을 채워요">자동 채우기</button></div>
          </div>
          <div class="field wide"><span>불러오면 제목 밑에 들어가는 설명</span>
            <textarea class="in intro-in" data-f="intro" rows="3" placeholder="예: ver. 2026&#10;예식장부터 혼수까지, 결혼 준비 체크리스트예요.">${esc(t.intro || "")}</textarea>
          </div>
          <label class="field"><span>종류</span>
            <select class="in" data-f="kind">
              <option value="budget"${!guest ? " selected" : ""}>예산표 (항목·선택지·수량·예산·지출)</option>
              <option value="guestbook"${guest ? " selected" : ""}>방명록 (이름·축의금)</option>
            </select>
          </label>
          <div class="field"><span>구성</span><div style="padding:8px 0;color:var(--muted)">카테고리 ${t.categories.length}개 · 항목 ${itemCount(t)}개</div></div>
        </div>
      </section>
      <div class="section-title">카테고리</div>
      ${t.categories.map((c, ci) => `
        <section class="card cat${guest ? " guest" : ""}${folded.has(c) ? " folded" : ""}" data-ci="${ci}">
          <div class="cat-top">
            <input class="cat-name" data-f="cat-name" value="${esc(c.name)}" placeholder="카테고리 이름" aria-label="카테고리 이름">
            <span class="count">항목 ${c.items.length}개</span>
            <button type="button" class="ic" data-act="cat-up" title="위로" aria-label="카테고리 위로" ${ci === 0 ? "disabled" : ""}>${ICON.up}</button>
            <button type="button" class="ic" data-act="cat-down" title="아래로" aria-label="카테고리 아래로" ${ci === t.categories.length - 1 ? "disabled" : ""}>${ICON.down}</button>
            <button type="button" class="ic fold" data-act="cat-fold" title="접기/펼치기" aria-label="접기/펼치기">${ICON.fold}</button>
            <button type="button" class="ic danger" data-act="cat-del" title="카테고리 삭제" aria-label="카테고리 삭제">${ICON.del}</button>
          </div>
          <div class="items">
            <div class="ihead"><span></span><span>${guest ? "이름" : "항목"}</span><span class="r col-qty">수량</span><span class="r">${guest ? "축의금" : "기본 예산"}</span><span class="col-opt">선택지</span><span></span></div>
            ${c.items.map((it, ii) => itemHTML(t, ci, ii, it)).join("")}
          </div>
          <div class="add-row"><button type="button" class="add-link" data-act="item-add">+ 항목 추가</button></div>
        </section>`).join("")}
      <button type="button" class="add-cat" data-act="cat-add">+ 카테고리 추가</button>`;
  }

  function renderAll(){
    if(sel >= data.length) sel = Math.max(0, data.length - 1);
    renderList(); renderEditor();
  }

  function focusSoon(selector){ requestAnimationFrame(() => { const el = edEl.querySelector(selector); if(el) el.focus(); }); }

  // ---- events: template list ----
  listEl.addEventListener("click", e => {
    const b = e.target.closest("[data-sel]");
    if(!b) return;
    sel = +b.dataset.sel; renderAll(); save();
    window.scrollTo({ top: 0 });
  });
  document.getElementById("addTpl").addEventListener("click", () => {
    data.push({ id: newId(), label: "새 템플릿", desc: "", title: "새 예산표", intro: "", kind: "budget", categories: [{ name: "첫 번째 카테고리", items: [{ name: "" }] }] });
    sel = data.length - 1; renderAll(); save();
    focusSoon('[data-f="label"]');
  });

  // ---- events: editor inputs (no re-render, keeps focus) ----
  edEl.addEventListener("input", e => {
    const f = e.target.dataset.f; if(!f) return;
    const t = tpl(); const v = e.target.value;
    const ci = e.target.closest("[data-ci]") ? +e.target.closest("[data-ci]").dataset.ci : -1;
    const ii = e.target.closest("[data-ii]") ? +e.target.closest("[data-ii]").dataset.ii : -1;
    const oi = e.target.closest("[data-oi]") ? +e.target.closest("[data-oi]").dataset.oi : -1;
    const it = ii >= 0 ? t.categories[ci].items[ii] : null;
    if(f === "label"){ t.label = v; edEl.querySelector(".meta-head h2").textContent = v || "이름 없음"; renderList(); }
    else if(f === "title") t.title = v;
    else if(f === "desc") t.desc = v;
    else if(f === "intro") t.intro = v;
    else if(f === "cat-name") t.categories[ci].name = v;
    else if(f === "name") it.name = v;
    else if(f === "qty"){ const n = Math.min(digits(v), 9999); e.target.value = n > 1 ? String(n) : v.replace(/[^\d]/g, ""); if(n > 1) it.qty = n; else delete it.qty; }
    else if(f === "budget"){ const n = digits(v); e.target.value = plain(n); if(n) it.budget = n; else delete it.budget; }
    else if(f === "opt-name") it.options[oi].name = v;
    else if(f === "opt-note"){ if(v) it.options[oi].note = v; else delete it.options[oi].note; }
    else if(f === "opt-price"){ const n = digits(v); e.target.value = plain(n); if(n) it.options[oi].price = n; else delete it.options[oi].price; }
    else if(f === "opt-link"){ if(v.trim()) it.options[oi].link = v.trim(); else delete it.options[oi].link; }
    save();
  });
  edEl.addEventListener("change", e => {
    if(e.target.dataset.f === "kind"){ tpl().kind = e.target.value; renderAll(); save(); }
  });

  // Enter in an item name → new item below; pasting several lines → one item per line
  edEl.addEventListener("keydown", e => {
    if(e.key !== "Enter" || e.isComposing || e.target.dataset.f !== "name") return;
    e.preventDefault();
    const ci = +e.target.closest("[data-ci]").dataset.ci, ii = +e.target.closest("[data-ii]").dataset.ii;
    tpl().categories[ci].items.splice(ii + 1, 0, { name: "" });
    renderAll(); save();
    focusSoon(`[data-ci="${ci}"] [data-ii="${ii + 1}"] [data-f="name"]`);
  });
  edEl.addEventListener("paste", e => {
    if(e.target.dataset.f !== "name") return;
    const text = (e.clipboardData || window.clipboardData).getData("text");
    const lines = text.split(/\r?\n/).map(s => s.replace(/^[\s\-•·*]+/, "").trim()).filter(Boolean);
    if(lines.length < 2) return;
    e.preventDefault();
    const ci = +e.target.closest("[data-ci]").dataset.ci, ii = +e.target.closest("[data-ii]").dataset.ii;
    const items = tpl().categories[ci].items;
    const snap = snapshot();
    if(!items[ii].name) items.splice(ii, 1, ...lines.map(name => ({ name })));
    else items.splice(ii + 1, 0, ...lines.map(name => ({ name })));
    renderAll(); save();
    toast(`항목 ${lines.length}개를 붙여넣었어요`, snap);
  });

  // ---- events: editor buttons ----
  edEl.addEventListener("click", e => {
    const b = e.target.closest("[data-act]"); if(!b) return;
    const act = b.dataset.act, t = tpl();
    const ci = b.closest("[data-ci]") ? +b.closest("[data-ci]").dataset.ci : -1;
    const ii = b.closest("[data-ii]") ? +b.closest("[data-ii]").dataset.ii : -1;
    const oi = b.closest("[data-oi]") ? +b.closest("[data-oi]").dataset.oi : -1;
    const c = ci >= 0 ? t.categories[ci] : null, it = ii >= 0 ? c.items[ii] : null;
    let snap;
    switch(act){
      case "tpl-up": if(move(data, sel, sel - 1)) sel--; break;
      case "tpl-down": if(move(data, sel, sel + 1)) sel++; break;
      case "tpl-dup": {
        const copy = clone(t); copy.id = newId(); copy.label = `${t.label} 복사본`;
        data.splice(sel + 1, 0, copy); sel++; break;
      }
      case "tpl-del":
        snap = snapshot(); data.splice(sel, 1);
        renderAll(); save(); toast(`'${t.label}' 템플릿을 삭제했어요`, snap); return;
      case "auto-desc": t.desc = autoDesc(t); break;
      case "cat-add":
        t.categories.push({ name: "", items: [{ name: "" }] });
        renderAll(); save(); focusSoon(`[data-ci="${t.categories.length - 1}"] [data-f="cat-name"]`); return;
      case "cat-up": move(t.categories, ci, ci - 1); break;
      case "cat-down": move(t.categories, ci, ci + 1); break;
      case "cat-fold": if(folded.has(c)) folded.delete(c); else folded.add(c); break;
      case "cat-del":
        snap = snapshot(); t.categories.splice(ci, 1);
        renderAll(); save(); toast(`'${c.name || "이름 없는 카테고리"}' 카테고리를 삭제했어요`, snap); return;
      case "item-add":
        c.items.push({ name: "" });
        renderAll(); save(); focusSoon(`[data-ci="${ci}"] [data-ii="${c.items.length - 1}"] [data-f="name"]`); return;
      case "item-up": move(c.items, ii, ii - 1); break;
      case "item-down": move(c.items, ii, ii + 1); break;
      case "item-del":
        snap = snapshot(); c.items.splice(ii, 1);
        renderAll(); save(); toast(`'${it.name || "빈 항목"}'을(를) 삭제했어요`, snap); return;
      case "opts": if(openOpts.has(it)) openOpts.delete(it); else openOpts.add(it); break;
      case "opt-add":
        (it.options = it.options || []).push({ name: "" });
        renderAll(); save(); focusSoon(`[data-ci="${ci}"] [data-ii="${ii}"] .opt:last-of-type [data-f="opt-name"]`); return;
      case "opt-del":
        it.options.splice(oi, 1); if(!it.options.length) delete it.options; break;
      default: return;
    }
    renderAll(); save();
  });

  // ---- drag items (within a category or into another), arrow keys on the grip ----
  // Same approach as the site: the row floats under the pointer, a dashed slot marks the drop spot,
  // other rows slide (FLIP). Hit-testing uses layout offsets so animations don't misplace drops.
  let drag = null;
  const reduceMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function flip(els, change){
    const before = new Map(els.map(el => [el, el.getBoundingClientRect()]));
    els.forEach(el => el.getAnimations().forEach(a => a.cancel()));
    change();
    if(reduceMotion()) return;
    els.forEach(el => {
      const a = before.get(el), b = el.getBoundingClientRect();
      const dx = a.left - b.left, dy = a.top - b.top;
      if(Math.abs(dx) >= 1 || Math.abs(dy) >= 1) el.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: "none" }], { duration: 200, easing: "cubic-bezier(.2,.8,.2,1)" });
    });
  }
  function rowBox(el){
    const c = el.offsetParent.getBoundingClientRect();
    const top = c.top + el.offsetTop, left = c.left + el.offsetLeft;
    return { left, top, right: left + el.offsetWidth, bottom: top + el.offsetHeight, mid: top + el.offsetHeight / 2 };
  }
  const inside = (el, x, y) => { const b = el.getBoundingClientRect(); return x >= b.left && x <= b.right && y >= b.top && y <= b.bottom; };

  function moveSlot(x, y){
    const { row, slot, gx, gy } = drag;
    row.style.left = `${x - gx}px`; row.style.top = `${y - gy}px`;
    const list = slot.parentElement;
    const rows = [...edEl.querySelectorAll(".cat:not(.folded) .item:not(.dragging)")];
    const target = rows.find(r => { const b = rowBox(r); return x >= b.left && x <= b.right && y >= b.top && y <= b.bottom; });
    if(target){
      const mid = rowBox(target).mid, dest = target.parentElement;
      const touched = rows.filter(r => r.parentElement === list || r.parentElement === dest);
      if(dest === list){
        const seq = [...list.children].filter(el => el === slot || (el.matches(".item") && !el.classList.contains("dragging")));
        const from = seq.indexOf(slot), to = seq.indexOf(target);
        if(!(to > from ? y > mid : y < mid)) return; // past the middle only, so rows don't flip back and forth
        flip(touched, () => { if(to > from) target.after(slot); else target.before(slot); });
      } else {
        flip(touched, () => { if(y > mid) target.after(slot); else target.before(slot); });
      }
      drag.moved = true;
      return;
    }
    // over a category with no items: drop at its end
    const card = [...edEl.querySelectorAll(".cat:not(.folded)")].find(c => inside(c, x, y));
    const cardList = card && card.querySelector(".items");
    if(cardList && cardList !== list && !cardList.querySelector(".item:not(.dragging)")){ cardList.appendChild(slot); drag.moved = true; }
  }

  function autoScroll(){
    if(!drag) return;
    const top = 110, bottom = window.innerHeight - 60;
    const speed = drag.y < top ? -Math.min(24, (top - drag.y) / 3 + 4) : drag.y > bottom ? Math.min(24, (drag.y - bottom) / 3 + 4) : 0;
    if(speed){ window.scrollBy(0, speed); moveSlot(drag.x, drag.y); }
    drag.raf = requestAnimationFrame(autoScroll);
  }

  function endDrag(cancel){
    if(!drag) return;
    const { row, slot, raf, moved } = drag;
    cancelAnimationFrame(raf);
    drag = null;
    document.body.classList.remove("is-sorting");
    if(cancel || !moved){ renderAll(); return; }
    // Rebuild each category's items from the page order (rows still carry their original indices)
    const t = tpl();
    const old = t.categories.map(c => c.items.slice());
    slot.replaceWith(row);
    edEl.querySelectorAll(".cat").forEach(card => {
      t.categories[+card.dataset.ci].items = [...card.querySelectorAll(".items > .item")].map(el => old[+el.dataset.ci][+el.dataset.ii]);
    });
    renderAll(); save();
  }

  edEl.addEventListener("pointerdown", e => {
    const grip = e.target.closest(".item-grip");
    if(!grip || e.button !== 0) return;
    e.preventDefault();
    if(document.activeElement) document.activeElement.blur();
    const row = grip.closest(".item");
    const r = row.getBoundingClientRect();
    const slot = document.createElement("div");
    slot.className = "item-slot";
    slot.style.height = `${r.height}px`;
    row.before(slot);
    Object.assign(row.style, { position: "fixed", left: `${r.left}px`, top: `${r.top}px`, width: `${r.width}px`, margin: "0" });
    row.classList.add("dragging");
    document.body.classList.add("is-sorting");
    try{ grip.setPointerCapture(e.pointerId); }catch(_){}
    drag = { row, slot, gx: e.clientX - r.left, gy: e.clientY - r.top, x: e.clientX, y: e.clientY, moved: false, raf: 0 };
    drag.raf = requestAnimationFrame(autoScroll);
  });
  window.addEventListener("pointermove", e => { if(!drag) return; drag.x = e.clientX; drag.y = e.clientY; moveSlot(e.clientX, e.clientY); });
  window.addEventListener("pointerup", () => endDrag(false));
  window.addEventListener("pointercancel", () => endDrag(true));
  document.addEventListener("keydown", e => {
    if(drag && e.key === "Escape"){ endDrag(true); return; }
    const grip = e.target.closest && e.target.closest(".item-grip");
    const step = grip && { ArrowUp: -1, ArrowDown: 1 }[e.key];
    if(!step) return;
    e.preventDefault();
    const row = grip.closest(".item"), ci = +row.dataset.ci, ii = +row.dataset.ii;
    if(!move(tpl().categories[ci].items, ii, ii + step)) return;
    renderAll(); save();
    focusSoon(`[data-ci="${ci}"] [data-ii="${ii + step}"] .item-grip`);
  });

  // ---- export ----
  function cleanData(){
    return data.map(t => ({
      id: t.id || newId(),
      label: (t.label || "").trim() || "이름 없는 템플릿",
      desc: (t.desc || "").trim(),
      intro: (t.intro || "").trim(),
      title: (t.title || "").trim() || (t.label || "새 예산표"),
      kind: t.kind === "guestbook" ? "guestbook" : "budget",
      categories: t.categories.map(c => ({
        name: (c.name || "").trim(),
        items: c.items.map(it => {
          const o = { name: (it.name || "").trim() };
          if(it.qty > 1) o.qty = it.qty;
          if(it.budget > 0) o.budget = it.budget;
          const opts = (it.options || []).filter(x => (x.name || "").trim()).map(x => {
            const y = { name: x.name.trim() };
            if(x.price > 0) y.price = x.price;
            if((x.link || "").trim()) y.link = x.link.trim();
            if((x.note || "").trim()) y.note = x.note.trim();
            return y;
          });
          if(opts.length && t.kind !== "guestbook") o.options = opts;
          return o;
        })
      }))
    }));
  }
  const exportText = () => JSON.stringify(cleanData(), null, 2);

  document.getElementById("downloadBtn").addEventListener("click", () => {
    const blob = new Blob([exportText() + "\n"], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "templates.json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast("templates.json을 내려받았어요");
  });
  document.getElementById("copyBtn").addEventListener("click", async () => {
    const text = exportText();
    try{ await navigator.clipboard.writeText(text); toast("JSON을 복사했어요"); }
    catch(e){
      const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy"); toast("JSON을 복사했어요"); }catch(_){ toast("복사하지 못했어요. 내려받기를 써 주세요."); }
      ta.remove();
    }
  });

  // ---- import (.json, or budget-checklist.html with its #templateData block) ----
  const importFile = document.getElementById("importFile");
  document.getElementById("importBtn").addEventListener("click", () => importFile.click());
  importFile.addEventListener("change", async () => {
    const file = importFile.files[0]; importFile.value = "";
    if(!file) return;
    let text = await file.text();
    const m = text.match(/<script[^>]*id="templateData"[^>]*>([\s\S]*?)<\/script>/);
    if(m) text = m[1];
    let list;
    try{ list = JSON.parse(text.replace(/<\\\//g, "</")); }catch(e){ toast("읽을 수 없는 파일이에요. templates.json이나 budget-checklist.html을 골라 주세요."); return; }
    if(!Array.isArray(list) || !list.every(t => t && Array.isArray(t.categories))){ toast("템플릿 형식이 아니에요"); return; }
    const snap = snapshot();
    data = list; sel = 0; renderAll(); save();
    toast(`템플릿 ${list.length}개를 불러왔어요`, snap);
  });

  document.getElementById("resetBtn").addEventListener("click", () => {
    const snap = snapshot();
    data = clone(ORIGINAL); sel = 0; renderAll(); save();
    toast("사이트에 들어 있던 처음 상태로 되돌렸어요", snap);
  });

  renderAll();
})();
</script>
</body>
</html>

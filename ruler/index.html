<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 버짓리스트처럼 늘 밝은 화면으로 보여요 -->
<meta name="color-scheme" content="light">
<title>룰러 · 내 수납장에 맞는 수납함 고르기</title>
<meta name="description" content="수납장 안쪽 치수를 넣고 이케아·다이소·무인양품 수납함을 3D로 넣었다 빼 보며 딱 맞는 조합을 찾아요.">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://slowmorn.com/ruler/">
<meta property="og:url" content="https://slowmorn.com/ruler/">
<meta property="og:site_name" content="룰러">
<meta property="og:type" content="website">
<meta property="og:locale" content="ko_KR">
<meta property="og:title" content="룰러 · 내 수납장에 맞는 수납함 고르기">
<meta property="og:description" content="이케아·다이소·무인양품 수납함을 3D로 넣어 보세요.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<link rel="stylesheet" href="assets/base.css?v=20261031j">
<link rel="stylesheet" href="assets/app.css?v=20261031j">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="./"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="7" width="19" height="10" rx="2" fill="currentColor"/><path d="M6.5 7v4M10 7v2.5M13.5 7v4M17 7v2.5" stroke="var(--sheet)" stroke-width="1.5" stroke-linecap="round"/></svg>룰러</a>
    <nav aria-label="주요 메뉴">
      <a href="../budget/">버짓리스트</a>
    </nav>
    <span class="spacer"></span>
  </div>
</header>

<!-- 넓은 화면: 왼쪽에 수납장 카드 · 3D · 수납함 목록, 오른쪽에 후보 수납함 (따라 내려와요)
     좁은 화면: 카드 → 3D → 후보 → 목록 순으로 한 줄 -->
<div class="wrap app">
  <!-- 수납장 카드 한 줄: 이름 · 안쪽 치수 · 채운 만큼 · 개수 · 금액 -->
  <section class="plan-card cab-card" aria-label="내 수납장">
    <div class="pc-title">
      <input id="cabName" class="plan-title" type="text" aria-label="수납장 이름" maxlength="40">
      <svg class="pc-pen" viewBox="0 0 16 16" aria-hidden="true"><path d="M10.5 3l2.5 2.5L6 12.5H3.5V10z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
    </div>
    <div class="dims" role="group" aria-label="수납장 안쪽 치수 (cm). 문이나 경첩을 뺀 안쪽을 재 주세요" title="문이나 경첩을 뺀 안쪽 치수를 재서 넣어 주세요">
      <span class="dims-cap">안쪽 치수</span>
      <label class="dim"><span>가로</span><input id="cab_w" type="number" inputmode="decimal" min="5" max="400" step="0.5"></label>
      <span class="dim-x" aria-hidden="true">×</span>
      <label class="dim"><span>깊이</span><input id="cab_d" type="number" inputmode="decimal" min="5" max="400" step="0.5"></label>
      <span class="dim-x" aria-hidden="true">×</span>
      <label class="dim"><span>높이</span><input id="cab_h" type="number" inputmode="decimal" min="5" max="400" step="0.5"></label>
      <span class="dims-unit">cm</span>
    </div>
    <div class="cab-stats">
      <div class="stat stat-fill">
        <span class="t-label">채움</span>
        <b id="tFill">0%</b>
        <span class="fill-track" aria-hidden="true"><span id="fillBar"></span></span>
      </div>
      <div class="stat">
        <span class="t-label">수납함</span>
        <b id="tCount">0개</b>
        <span class="t-sub" id="tHeadroom"></span>
      </div>
      <div class="stat">
        <span class="t-label">합계</span>
        <b id="tPrice">0원</b>
      </div>
    </div>
    <button type="button" class="rec-btn" id="recBtn" aria-controls="rec" aria-expanded="false"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.8l1.5 3.9 3.9 1.5-3.9 1.5L8 12.6 6.5 8.7 2.6 7.2l3.9-1.5z" fill="currentColor"/><path d="M13 10.5l.6 1.4 1.4.6-1.4.6-.6 1.4-.6-1.4-1.4-.6 1.4-.6z" fill="currentColor"/></svg>추천 수납함</button>
  </section>

  <!-- 추천 수납함: 수납장 종류(선반·서랍)와 구성(한 종류·두 크기)을 고르면 맞는 구성을 보여 줘요. 누르면 바로 넣어요 -->
  <section class="rec" id="rec" hidden aria-label="추천 수납함">
    <div class="rec-head">
      <h2>추천 수납함</h2>
      <div class="seg" role="group" aria-label="수납장 종류">
        <button type="button" data-type="shelf" aria-pressed="true">선반</button>
        <button type="button" data-type="drawer" aria-pressed="false">서랍</button>
      </div>
      <div class="seg" role="group" aria-label="구성">
        <button type="button" data-mode="one" aria-pressed="true">한 종류</button>
        <button type="button" data-mode="two" aria-pressed="false">두 크기</button>
      </div>
      <span class="rec-hint" id="recHint"></span>
      <span class="spacer"></span>
      <button type="button" class="rec-x" id="recClose" aria-label="추천 닫기" title="닫기"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    </div>
    <ul class="rec-list" id="recList"></ul>
  </section>

  <!-- 3D: 상자를 누르면 고르고, 끌어서 옮기고, 앞쪽으로 끌어내면 빠져요 -->
  <section class="stage-wrap" aria-label="3D 수납장">
    <div class="stage" id="stage"></div>
    <div class="stage-tools">
      <span class="sel-info" id="selInfo"></span>
      <span class="spacer"></span>
      <button type="button" class="tool" id="rotBtn" title="돌리기 (R)"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M12.5 8a4.5 4.5 0 1 1-1.3-3.2M12.5 2.5v2.8H9.7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>돌리기</button>
      <button type="button" class="tool" id="delBtn" title="빼기 (Delete)"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>빼기</button>
      <button type="button" class="tool" id="viewBtn" title="처음 시점으로"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 6V2.5H6M13.5 6V2.5H10M2.5 10v3.5H6M13.5 10v3.5H10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="tool-label">시점</span></button>
    </div>
    <p class="stage-hint">드래그로 돌려 보고, 상자를 끌어 옮겨요. 앞쪽으로 끌어내면 빠져요.</p>
  </section>

  <!-- 수납함 목록: 누르면 후보에 담고 한 개 넣어 봐요 -->
  <section class="catalog" aria-label="수납함 목록">
    <div class="list-head">
      <h2>수납함 <span class="count" id="listCount"></span></h2>
      <div class="chips" id="brandChips" role="group" aria-label="브랜드">
        <button type="button" class="chip" data-brand-filter="all" aria-pressed="true">전체</button>
        <button type="button" class="chip" data-brand-filter="ikea" data-brand="ikea" aria-pressed="false"><span class="brand-dot" aria-hidden="true"></span>이케아</button>
        <button type="button" class="chip" data-brand-filter="daiso" data-brand="daiso" aria-pressed="false"><span class="brand-dot" aria-hidden="true"></span>다이소</button>
        <button type="button" class="chip" data-brand-filter="muji" data-brand="muji" aria-pressed="false"><span class="brand-dot" aria-hidden="true"></span>무인양품</button>
      </div>
      <span class="spacer"></span>
      <label class="toggle"><input type="checkbox" id="fitOnly" checked><span>이 수납장에 들어가는 것만</span></label>
      <select id="sortBy" aria-label="정렬">
        <option value="fit">잘 맞는 순</option>
        <option value="small">작은 순</option>
        <option value="price">가격 낮은 순</option>
      </select>
    </div>
    <ul class="item-list" id="itemList"><li class="empty">불러오는 중…</li></ul>
    <p class="note">치수와 가격은 판매처 표기 기준이에요. 실제와 조금 다를 수 있어요.</p>
  </section>

  <!-- 후보 수납함: 장바구니처럼 담아 두고 개수(0개도)를 늘리고 줄이며 넣었다 빼요 -->
  <aside class="side bag" aria-label="후보 수납함">
    <div class="bag-head">
      <h2>후보 수납함 <span class="count" id="candCount"></span></h2>
      <button type="button" class="link-btn" id="clearBtn" hidden>모두 빼기</button>
    </div>
    <ul class="cand-list" id="candList"></ul>
  </aside>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<footer>
  <p class="foot-note">룰러는 판매처와 관계없는 개인 서비스예요. 상품 정보는 각 판매처 페이지에서 확인해 주세요.</p>
  <div class="foot-inner"><span>© slowmorn</span></div>
</footer>

<script type="module" src="assets/app.js?v=20261031j"></script>
</body>
</html>

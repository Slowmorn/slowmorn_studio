<!-- 2. 시뮬레이션 -->
<main id="sim" class="sim" hidden>
  <section class="sim-head">
    <canvas class="scene" id="scene" width="80" height="40" role="img" aria-label="지금 시기의 아기 모습 도트 그림"></canvas>
    <div class="now">
      <p class="now-who" id="nowWho"></p>
      <h1 class="now-label" id="nowLabel">임신 4주</h1>
      <p class="now-date" id="nowDate"></p>
      <p class="now-cap" id="nowCaption"></p>
      <p class="now-mom" id="nowMom"></p>
    </div>
    <div class="controls">
      <button class="btn-play" id="btnPlay" type="button" aria-label="재생"><svg viewBox="0 0 20 20" aria-hidden="true"><path class="i-play" d="M6 4.5v11l9-5.5z"/><g class="i-pause"><rect x="5" y="4.5" width="3.4" height="11" rx="1"/><rect x="11.6" y="4.5" width="3.4" height="11" rx="1"/></g></svg></button>
      <div class="seg seg-sm" role="radiogroup" aria-label="속도" id="speedSeg">
        <label><input type="radio" name="simSpeed" value="1"><span>1×</span></label>
        <label><input type="radio" name="simSpeed" value="2"><span>2×</span></label>
        <label><input type="radio" name="simSpeed" value="4"><span>4×</span></label>
      </div>
      <button class="btn-ghost" id="btnNext" type="button">다음 결정</button>
    </div>
    <div class="track" id="track" aria-hidden="true">
      <div class="track-phases" id="trackPhases"></div>
      <div class="track-marks" id="trackMarks"></div>
      <div class="track-fill" id="trackFill"></div>
      <div class="track-now" id="trackNow"></div>
    </div>
    <p class="up-next" id="upNext"></p>
  </section>

  <nav class="tabs" id="tabs" aria-label="보기">
    <button type="button" data-tab="feed" aria-pressed="true">타임라인</button>
    <button type="button" data-tab="budget" aria-pressed="false">예산</button>
    <button type="button" data-tab="log" aria-pressed="false">선택 기록 <b id="logCount">0</b></button>
  </nav>

  <div class="sim-body" data-tab="feed" id="simBody">
    <section class="feed" id="feed" aria-live="polite"></section>
    <aside class="side">
      <section class="panel" id="budgetPanel"></section>
      <section class="panel" id="logPanel"></section>
    </aside>
  </div>
</main>

<!-- 3. 정리 -->
<main id="report" class="report" hidden></main>

<!-- 결정 카드 -->
<dialog id="decide" class="decide"></dialog>

<!-- 확인 창 (브라우저 기본 confirm 은 앱 속 브라우저에서 막히는 경우가 있어 직접 띄워요) -->
<dialog id="ask" class="decide ask">
  <form method="dialog" class="decide-inner">
    <h2 id="askTitle"></h2>
    <p class="decide-body" id="askBody"></p>
    <div class="decide-actions">
      <button type="submit" class="btn-ghost" value="no">취소</button>
      <button type="submit" class="btn-primary" value="yes" id="askYes">확인</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status"></div>
